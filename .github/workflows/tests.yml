name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Astro runtime image
        run: docker build -t clone-tools-ci .

      # BigQuery is faked (tests/conftest.py FakeBigQuery); tests that need the
      # real thing are marked integration and skipped here.
      - name: Run pytest inside the Astro runtime image
        run: |
          docker run --rm \
            -e GEMINI_API_KEY=ci-dummy -e RIOT_API_KEY=ci-dummy \
            clone-tools-ci python -m pytest tests -v -m "not integration"

  astro-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Astro CLI
        run: curl -sSL install.astronomer.io | sudo bash -s

      # .env is gitignored; astro dev pytest passes it into the container.
      - name: Write dummy env file
        run: |
          printf 'GEMINI_API_KEY=ci-dummy\nRIOT_API_KEY=ci-dummy\n' > .env

      - name: Run astro dev pytest
        # astro splits --args on whitespace and ignores inner quotes, so the
        # marker expression is written without a space: not(integration).
        run: astro dev pytest --docker --args "-v -m not(integration)"
