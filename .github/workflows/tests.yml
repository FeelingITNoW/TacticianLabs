name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Astro runtime image
        run: docker build -t clone-tools-ci .

      # BigQuery is faked (tests/conftest.py FakeBigQuery); tests that need the
      # real thing are marked integration and skipped here.
      - name: Run pytest inside the Astro runtime image
        run: |
          docker run --rm \
            -e GEMINI_API_KEY=ci-dummy -e RIOT_API_KEY=ci-dummy \
            clone-tools-ci python -m pytest tests -v -m "not integration"
