[project]
name = "clone-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.15.0",
    "google-genai>=1.70.0",
    "httpx>=0.28.1",
    "pandas>=3.0.2",
    "psycopg2>=2.9.11",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.2.2",
    "ruff==0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "include", "dags"]
testpaths = ["tests"]
markers = [
    "integration: hits live services (Riot API with a real RIOT_API_KEY, or BigQuery with ADC)",
]

[tool.ruff]
extend-exclude = [".conda", ".venv-1", "logs", "plugins"]

[tool.ruff.lint]
# Ruff's own conservative defaults, pinned explicitly so a version bump
# (local, CI, or ruff-action falling back to "latest") can't silently
# pull in a much larger ruleset (isort, pylint, flake8-datetimez, etc.)
# that this codebase was never written against.
select = ["E4", "E7", "E9", "F"]
